name: AniMeXe Episode Visual Cut

on:
  workflow_dispatch:
    inputs:
      input_mode:
        description: "Episode source available to the runner"
        required: true
        type: choice
        options:
          - synthetic
          - workspace
        default: synthetic
      input_path:
        description: "Path to an episode file already present on the runner/repository"
        required: true
        default: "workspace/input/episode.mkv"
      target_duration_seconds:
        description: "Target duration for the visual explanation cut"
        required: true
        default: "120"

permissions:
  contents: read

concurrency:
  group: \${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-cut:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install media tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Validate Gemini secret
        run: |
          test -n "$GEMINI_API_KEY" || {
            echo "::error::GEMINI_API_KEY repository secret is missing."
            exit 1
          }

      - name: Create visual-cut configuration
        run: |
          mkdir -p workspace/e2e
          cp config/config.example.yml config/config.yml
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("config/config.yml")
          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          data["llm"]["model"] = "gemini-3.8-flash"
          data["llm"]["thinking_level"] = "low"
          data["llm"]["max_frames"] = 8
          data["llm"]["max_output_tokens"] = 6000
          target = float("\${{ inputs.target_duration_seconds }}")
          if "\${{ inputs.input_mode }}" == "synthetic":
              data["narration"]["target_duration_seconds"] = min(target, 20.0)
              data["narration"]["min_duration_seconds"] = min(15.0, data["narration"]["target_duration_seconds"])
              data["narration"]["max_duration_seconds"] = max(
                  data["narration"]["target_duration_seconds"],
                  min(30.0, target),
              )
          else:
              data["narration"]["target_duration_seconds"] = target
              data["narration"]["min_duration_seconds"] = max(1.0, target * 0.875)
              data["narration"]["max_duration_seconds"] = target * 1.125
          path.write_text(
              yaml.safe_dump(data, sort_keys=False, allow_unicode=True),
              encoding="utf-8",
          )
          PY

      - name: Prepare episode input
        run: |
          mkdir -p workspace/input workspace/e2e
          if [ "\${{ inputs.input_mode }}" = "workspace" ]; then
            test -s "\${{ inputs.input_path }}" || {
              echo "::error::Episode file not found at '\${{ inputs.input_path }}'."
              echo "For real episodes, the file must be provisioned to the runner before this workflow starts."
              exit 1
            }
            cp "\${{ inputs.input_path }}" workspace/e2e/source-episode.mkv
            echo "EPISODE=workspace/e2e/source-episode.mkv" >> "$GITHUB_ENV"
            exit 0
          fi

          cat > workspace/e2e/transcript.srt <<'SRT'
          1
          00:00:00,500 --> 00:00:04,000
          A quiet signal reaches the camp.

          2
          00:00:06,500 --> 00:00:10,000
          The team follows a strange light.

          3
          00:00:12,500 --> 00:00:16,000
          A hidden gate opens in the ruins.

          4
          00:00:18,000 --> 00:00:23,000
          They step through and discover a new path.
          SRT

          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=red:s=640x360:r=30:d=6" \
            -f lavfi -i "color=c=blue:s=640x360:r=30:d=6" \
            -f lavfi -i "color=c=green:s=640x360:r=30:d=6" \
            -f lavfi -i "color=c=purple:s=640x360:r=30:d=6" \
            -filter_complex "[0:v][1:v][2:v][3:v]concat=n=4:v=1:a=0,format=yuv420p[v]" \
            -map "[v]" -c:v libx264 -preset ultrafast -crf 30 -an \
            workspace/e2e/video-only.mkv

          ffmpeg -hide_banner -loglevel error -y \
            -i workspace/e2e/video-only.mkv \
            -i workspace/e2e/transcript.srt \
            -map 0:v:0 -map 1:0 \
            -c:v copy -c:s srt -metadata:s:s:0 language=eng \
            workspace/e2e/source-episode.mkv

          echo "EPISODE=workspace/e2e/source-episode.mkv" >> "$GITHUB_ENV"

      - name: Inspect episode
        run: |
          python -m animexe episode inspect "$EPISODE"

      - name: Detect scenes
        run: |
          python -m animexe episode scenes "$EPISODE"

      - name: Extract transcript
        run: |
          python -m animexe episode transcript "$EPISODE"

      - name: Understand story
        run: |
          python -m animexe episode story "$EPISODE" --mode gemini

      - name: Build narration-free visual cut
        run: |
          python -m animexe episode visual-cut \
            "$EPISODE" \
            --target-duration-seconds "\${{ inputs.target_duration_seconds }}"

      - name: Validate video-only output
        run: |
          OUTPUT="workspace/output/source-episode-visual-cut.mp4"
          test -s "$OUTPUT"
          ffprobe -v error -print_format json -show_streams -show_format "$OUTPUT" > workspace/e2e/visual-cut-ffprobe.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("workspace/e2e/visual-cut-ffprobe.json").read_text())
          streams = report.get("streams", [])
          kinds = {stream.get("codec_type") for stream in streams}
          if kinds != {"video"}:
              raise SystemExit(f"visual cut must contain video only; got stream types: {sorted(kinds)}")
          duration = float((report.get("format") or {}).get("duration") or 0)
          if duration <= 0:
              raise SystemExit("visual cut has invalid duration")
          print(f"Visual cut validated: {duration:.2f}s, video-only")
          PY

      - name: Upload visual-cut artifact
        if: \${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: animexe-episode-visual-cut
          path: |
            workspace/output/*-visual-cut.mp4
            workspace/analysis/*/edit_plan.json
            workspace/analysis/*/story.json
            workspace/analysis/*/scenes.json
            workspace/e2e
          if-no-files-found: warn
          retention-days: 7
