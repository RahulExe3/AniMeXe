name: AniMeXe Provider Smoke

on:
  workflow_dispatch:
    inputs:
      anime_id:
        description: "AniList-backed anime id (for example anilist:21)"
        required: true
        default: "anilist:21"
      episode:
        description: "Episode number to check"
        required: true
        default: "1"
      language:
        description: "Audio track"
        required: true
        type: choice
        options:
          - sub
          - dub
        default: sub

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUHI_API_BASE_URL: ${{ vars.KUHI_API_BASE_URL }}
      ANIVEXA_API_BASE_URL: ${{ vars.ANIVEXA_API_BASE_URL }}
      ANIVAULT_API_BASE_URL: ${{ vars.ANIVAULT_API_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Collect provider health report
        run: |
          python -m animexe provider status \
            --output provider-health.json

      - name: Probe requested episode across providers
        run: |
          python -m animexe provider check \
            "${{ inputs.anime_id }}" \
            --episode-number "${{ inputs.episode }}" \
            --language "${{ inputs.language }}" \
            --output provider-report.json \
            --require-catalog

      - name: Upload provider reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-smoke-report-${{ inputs.anime_id }}-ep${{ inputs.episode }}-${{ inputs.language }}
          path: |
            provider-health.json
            provider-report.json
          if-no-files-found: warn
          --output workspace/provider-smoke/provider-report.json

      - name: Upload provider report
        uses: actions/upload-artifact@v7
        with:
          name: provider-smoke-report
          path: workspace/provider-smoke/provider-report.json
          if-no-files-found: error
          retention-days: 7
