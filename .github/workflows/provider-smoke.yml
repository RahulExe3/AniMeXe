name: AniMeXe Provider Smoke

on:
  workflow_dispatch:
    inputs:
      anime_id:
        description: "AniList-backed anime id (for example anilist:21)"
        required: true
        default: "anilist:21"
      episode:
        description: "Episode number to check"
        required: true
        default: "1"
      language:
        description: "Audio track"
        required: true
        type: choice
        options:
          - sub
          - dub
        default: sub

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUHI_API_BASE_URL: ${{ vars.KUHI_API_BASE_URL }}
      ANIVEXA_API_BASE_URL: ${{ vars.ANIVEXA_API_BASE_URL }}
      ANIVAULT_API_BASE_URL: ${{ vars.ANIVAULT_API_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Show provider health
        run: python -m animexe provider status

      - name: Probe requested episode across providers
        run: >
          python -m animexe provider check
          "${{ inputs.anime_id }}"
          --episode-number "${{ inputs.episode }}"
          --language "${{ inputs.language }}"
