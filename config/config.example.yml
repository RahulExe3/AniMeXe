project:
  name: AniMeXe
  language: hinglish

provider:
  # Primary catalog/availability provider.
  name: kuhi
  api_base_url: ${KUHI_API_BASE_URL}
  language: sub

provider_fallbacks:
  # Optional secondary catalog/availability providers.
  # These endpoints are used for catalog/availability checks only.
  - name: anivexa
    api_base_url: ${ANIVEXA_API_BASE_URL}
    language: sub
  - name: anivault
    api_base_url: ${ANIVAULT_API_BASE_URL}
    language: sub

metadata:
  anilist_endpoint: https://graphql.anilist.co
  jikan_base_url: https://api.jikan.moe/v4
  search_limit: 10

scheduler:
  max_active_anime: 4
  daily_output_limit: 2
  count_mode: successful_outputs
  strategy: balanced

llm:
  # Semantic story-understanding backend.
  provider: gemini
  model: gemini-3.8-flash
  api_key_env: GEMINI_API_KEY
  temperature: 0.2
  max_output_tokens: 12000
  thinking_level: medium
  max_frames: 32

episode:
  input_mode: local_or_provider
  scene_detection: true
  scene_threshold: 27.0
  scene_min_duration: 0.5
  scene_frame_width: 640
  transcript: auto

narration:
  style: conversational
  # Supported languages: english, hinglish.
  # English uses Latin script; Hinglish uses Roman script.
  language: hinglish
  script: roman
  target_duration_seconds: 120
  min_duration_seconds: 105
  max_duration_seconds: 135
  words_per_minute: 145
  speed: 1.0

tts:
  # synthetic is deterministic and useful for end-to-end pipeline tests.
  # command bridges to a local/external TTS runner.
  # gemini uses Gemini 3.8 Flash TTS for natural expressive narration.
  provider: synthetic
  model: gemini-3.8-flash-tts
  api_key_env: GEMINI_API_KEY
  voice: null
  style: "natural, conversational, expressive YouTube narrator; clear sentence endings; natural pauses; believable Hinglish delivery"
  command: []
  timeout_seconds: 180

  # Production Gemini TTS example:
  # provider: gemini
  # voice: Kore


video:
  width: 1920
  height: 1080
  fps: 30
  max_clip_duration: 8

audio:
  mute_source: true
  bgm: true
  music_dir: assets/music
  bgm_volume: 0.12
  bgm_ducking_ratio: 8.0
  sfx: optional

subtitles:
  enabled: true
  burn_in: true

publishing:
  enabled: false