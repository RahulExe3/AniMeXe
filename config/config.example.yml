project:
  name: AniMeXe
  language: hinglish

provider:
  # Kuhi / anime-api is the current primary external provider target.
  name: kuhi
  api_base_url: ${KUHI_API_BASE_URL}
  language: sub

metadata:
  anilist_endpoint: https://graphql.anilist.co
  jikan_base_url: https://api.jikan.moe/v4
  search_limit: 10

scheduler:
  max_active_anime: 4
  daily_output_limit: 2
  count_mode: successful_outputs
  strategy: balanced

episode:
  input_mode: local_or_provider
  scene_detection: true
  transcript: auto

narration:
  style: conversational
  language: hinglish
  speed: 1.0

video:
  width: 1920
  height: 1080
  fps: 30
  max_clip_duration: 8

audio:
  mute_source: true
  bgm: true
  sfx: optional

subtitles:
  enabled: true
  burn_in: true

publishing:
  enabled: false